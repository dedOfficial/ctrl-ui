pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: pnpm exec oxlint {staged_files}
    fmt:
      # Repo-wide, like CI's fmt:check, so .oxfmtrc.json ignorePatterns stays
      # the single source of truth. Passing {staged_files} under a glob that
      # matches md fails a docs-only commit: every path is ignored by oxfmt,
      # which then exits 2 on an empty target list.
      run: pnpm exec oxfmt --check .

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
